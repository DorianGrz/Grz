<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0"><link rel="stylesheet" href="lk.css"><section class="lk-root lk-cart" id="lk-lk_cart">
  <div class="lk-cart__bar">
    <a href="/products/girlanda-cedrowa" class="lk-cart__back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span>Wróć do sklepu</span>
    </a>
    <a href="/" class="lk-brand__name" aria-label="Leśny Kominek"><img src="https://cdn.shopify.com/s/files/1/1088/3714/2862/files/lk-logo.png?width=900" height="30" alt="Leśny Kominek"></a>
    <span class="lk-cart__bar-gap" aria-hidden="true"></span>
  </div>

  <div class="lk-wrap"><div class="lk-cart__empty">
        <span class="lk-cart__empty-ico" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></span>
        <h1 class="lk-h2">Twój koszyk jest pusty</h1>
        <p>Zajrzyj do Girlandy Cedrowej i wybierz zestaw dla siebie.</p>
        <a href="/products/girlanda-cedrowa" class="lk-btn">Zobacz girlandę</a>
      </div></div>
</section>
<script>
  (function () {
    var root = document.getElementById('lk-lk_cart');
    if (!root || root.dataset.lkInit) return;
    root.dataset.lkInit = '1';
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('#lk-lk_cart [data-lk-upgrade]');
      if (!btn) return;
      btn.disabled = true;
      var updates = {};
      updates[btn.dataset.from] = 0;
      updates[btn.dataset.to] = Number(btn.dataset.qty);
      fetch('/cart/update.js', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ updates: updates })
      }).then(function () { window.location.reload(); }, function () { btn.disabled = false; });
    });
  })();
</script>
